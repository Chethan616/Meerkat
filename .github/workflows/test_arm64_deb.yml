name: Build arm64 deb

on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.35.6"

jobs:
  get_version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' app/pubspec.yaml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  # NOTE: Flutter does not provide official Linux ARM64 binaries.
  # This job requires a self-hosted ARM64 runner with Flutter pre-installed.
  # To enable: add a runner with labels [self-hosted, linux, arm64]
  build_deb_arm_64:
    needs: get_version
    runs-on: [self-hosted, linux, arm64]

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev ninja-build libayatana-appindicator3-dev

      - name: Enable flutter_distributor
        run: dart pub global activate flutter_distributor

      - name: Build deb package
        working-directory: app
        run: PATH="$PATH:$HOME/.pub-cache/bin" flutter_distributor package --platform linux --targets deb

      - name: Find deb file
        id: find_deb
        run: |
          DEB_PATH=$(find app/dist -name "*.deb" | head -1)
          if [ -z "$DEB_PATH" ]; then
            echo "::error::No .deb file found in app/dist"
            exit 1
          fi
          echo "deb_path=$DEB_PATH" >> $GITHUB_OUTPUT

      # Fix architecture label — https://github.com/leanflutter/flutter_distributor/pull/150
      - name: Fix deb architecture to arm64
        run: |
          mkdir -p temp_deb
          cd temp_deb
          ar x "../${{ steps.find_deb.outputs.deb_path }}"
          tar xJf control.tar.xz --overwrite
          sed -i '/Architecture:/c\Architecture: arm64' ./control
          tar cJf control.tar.xz control postinst postrm
          ar rcs "../${{ steps.find_deb.outputs.deb_path }}" debian-binary control.tar.xz data.tar.xz

      - name: Rename deb
        run: |
          VERSION=${{ needs.get_version.outputs.version }}
          cp "${{ steps.find_deb.outputs.deb_path }}" "/tmp/Meerkat-${VERSION}-linux-arm-64.deb"

      - name: Upload deb file
        uses: actions/upload-artifact@v4
        with:
          name: deb-arm-64-result
          path: /tmp/Meerkat-*-linux-arm-64.deb
