name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FLUTTER_VERSION: "3.35.6"

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: Dependencies (app)
        working-directory: app
        run: flutter pub get

      - name: Remove gen directory (app)
        working-directory: app
        run: rm -rf lib/gen

      - name: Check format (app)
        working-directory: app
        run: dart format --set-exit-if-changed lib test

      - name: Dependencies (common)
        working-directory: common
        run: dart pub get

      - name: Check format (common)
        working-directory: common
        run: dart format --set-exit-if-changed lib test

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.84.1"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: Dependencies (app)
        working-directory: app
        run: flutter pub get

      - name: Analyze (app)
        working-directory: app
        run: flutter analyze

      - name: Test (app)
        working-directory: app
        run: flutter test

      - name: Dependencies (common)
        working-directory: common
        run: dart pub get

      - name: Analyze (common)
        working-directory: common
        run: dart analyze

      - name: Test (common)
        working-directory: common
        run: dart test

  packaging:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Compare pubspec and Inno Setup versions
        run: |
          PUBSPEC_VERSION=$(grep '^version: ' app/pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          INNO_VERSION=$(grep '#define MyAppVersion ' scripts/compile_windows_exe-inno.iss | sed 's/#define MyAppVersion "//' | sed 's/"//')
          echo "Pubspec version: $PUBSPEC_VERSION"
          echo "Inno Setup version: $INNO_VERSION"
          if [ "$PUBSPEC_VERSION" != "$INNO_VERSION" ]; then
            echo "::error::Version mismatch! pubspec.yaml=$PUBSPEC_VERSION vs inno.iss=$INNO_VERSION"
            exit 1
          else
            echo "Versions match: $PUBSPEC_VERSION"
          fi
