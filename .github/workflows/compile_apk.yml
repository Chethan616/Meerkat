name: Compile APK

on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.35.6"
  RUST_VERSION: "1.84.1"
  APK_BUILD_DIR: "/tmp/build"

jobs:
  get_version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' app/pubspec.yaml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build_apk:
    needs: get_version
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove proprietary dependencies
        run: sh scripts/remove_proprietary_dependencies.sh

      - name: Copy files to build dir
        run: |
          mkdir -p $APK_BUILD_DIR
          cp -r . $APK_BUILD_DIR

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: "aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android"

      - name: Check rust toolchain
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: rustup show

      - name: Decode signing secrets (if available)
        working-directory: ${{ env.APK_BUILD_DIR }}
        env:
          ENCODED_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
          ENCODED_KEY_STORE: ${{ secrets.ANDROID_KEY_STORE }}
        run: |
          if [ -n "$ENCODED_KEY_PROPERTIES" ] && [ -n "$ENCODED_KEY_STORE" ]; then
            echo "Signing secrets found — building signed APK"
            echo $ENCODED_KEY_PROPERTIES | base64 -di > app/android/key.properties
            mkdir -p secrets && echo $ENCODED_KEY_STORE | base64 -di > secrets/android-keystore.jks
          else
            echo "No signing secrets — building unsigned APK"
          fi

      - name: Dependencies
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: flutter pub get

      - name: Build APK
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: flutter build apk --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-result
          path: |
            ${{ env.APK_BUILD_DIR }}/app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            ${{ env.APK_BUILD_DIR }}/app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            ${{ env.APK_BUILD_DIR }}/app/build/app/outputs/flutter-apk/app-x86_64-release.apk
