name: Build rpm package

on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.35.6"
  RUST_VERSION: "1.84.1"

jobs:
  get_version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' app/pubspec.yaml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build_rpm:
    needs: get_version
    runs-on: ubuntu-latest
    container: fedora:38

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          dnf install -y clang cmake gtk3-devel ninja-build \
            libappindicator-gtk3-devel jq findutils which git \
            patchelf rpm-build curl unzip

      - name: Install Flutter manually (Fedora container)
        run: |
          curl -fsSL https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${{ env.FLUTTER_VERSION }}-stable.tar.xz \
            -o /tmp/flutter.tar.xz
          tar -xJf /tmp/flutter.tar.xz -C /opt
          echo "/opt/flutter/bin" >> $GITHUB_PATH

      - name: Configure Git safe directory for Flutter
        run: git config --global --add safe.directory /opt/flutter

      - name: Flutter doctor
        run: /opt/flutter/bin/flutter doctor

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Enable flutter_distributor
        run: /opt/flutter/bin/dart pub global activate flutter_distributor

      - name: Dependencies
        working-directory: app
        run: /opt/flutter/bin/flutter pub get

      - name: Build rpm package
        working-directory: app
        run: |
          PATH="$PATH:$HOME/.pub-cache/bin" \
          FLUTTER_ROOT=/opt/flutter \
          flutter_distributor package --platform linux --targets rpm

      - name: Find and rename rpm file
        id: find_rpm
        run: |
          VERSION=${{ needs.get_version.outputs.version }}
          RPM_PATH=$(find app/dist -name "*.rpm" | head -1)
          if [ -z "$RPM_PATH" ]; then
            echo "::error::No .rpm file found in app/dist"
            exit 1
          fi
          DEST="/tmp/Meerkat-${VERSION}-linux-x86-64.rpm"
          cp "$RPM_PATH" "$DEST"
          echo "rpm_path=$DEST" >> $GITHUB_OUTPUT

      - name: Upload rpm file
        uses: actions/upload-artifact@v4
        with:
          name: rpm-result
          path: ${{ steps.find_rpm.outputs.rpm_path }}
