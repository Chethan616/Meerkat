name: Build arm64 tar

on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.35.6"

jobs:
  get_version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' app/pubspec.yaml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  # NOTE: Flutter does not provide official Linux ARM64 binaries.
  # This job requires a self-hosted ARM64 runner with Flutter pre-installed.
  # To enable: add a runner with labels [self-hosted, linux, arm64]
  build_tar_arm_64:
    needs: get_version
    runs-on: [self-hosted, linux, arm64]

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev ninja-build libayatana-appindicator3-dev

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Build Linux (arm64)
        working-directory: app
        run: flutter build linux

      - name: Create tar.gz archive
        run: |
          VERSION=${{ needs.get_version.outputs.version }}
          cd app/build/linux/arm64/release/bundle
          tar -czvf "/tmp/Meerkat-${VERSION}-linux-arm-64.tar.gz" *

      - name: Upload tar.gz archive
        uses: actions/upload-artifact@v4
        with:
          name: tar-gz-arm-64-result
          path: /tmp/Meerkat-*-linux-arm-64.tar.gz
