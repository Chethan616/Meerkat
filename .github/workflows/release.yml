name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  FLUTTER_VERSION: "3.35.6"
  RUST_VERSION: "1.84.1"
  APK_BUILD_DIR: "/tmp/build"

jobs:
  # ─────────────────────────────────────────────
  # Get version from pubspec.yaml
  # ─────────────────────────────────────────────
  get_version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' app/pubspec.yaml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

  # ─────────────────────────────────────────────
  # Android APK (unsigned — no signing secrets needed)
  # ─────────────────────────────────────────────
  build_apk:
    needs: get_version
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove proprietary dependencies
        run: sh scripts/remove_proprietary_dependencies.sh

      - name: Copy files to build dir
        run: |
          mkdir -p $APK_BUILD_DIR
          cp -r . $APK_BUILD_DIR

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: "aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android"

      - name: Check rust toolchain
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: rustup show

      - name: Dependencies
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: flutter pub get

      - name: Decode signing secrets (if available)
        working-directory: ${{ env.APK_BUILD_DIR }}
        env:
          ENCODED_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
          ENCODED_KEY_STORE: ${{ secrets.ANDROID_KEY_STORE }}
        run: |
          if [ -n "$ENCODED_KEY_PROPERTIES" ] && [ -n "$ENCODED_KEY_STORE" ]; then
            echo "Signing secrets found — building signed APK"
            echo $ENCODED_KEY_PROPERTIES | base64 -di > app/android/key.properties
            mkdir -p secrets && echo $ENCODED_KEY_STORE | base64 -di > secrets/android-keystore.jks
            echo "SIGNED=true" >> $GITHUB_ENV
          else
            echo "No signing secrets — building unsigned APK"
            echo "SIGNED=false" >> $GITHUB_ENV
          fi

      - name: Build APK (split per ABI)
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: flutter build apk --split-per-abi

      - name: Rename APKs
        run: |
          VERSION=${{ needs.get_version.outputs.version }}
          BUILD_DIR="${{ env.APK_BUILD_DIR }}/app/build/app/outputs/flutter-apk"
          cp "$BUILD_DIR/app-armeabi-v7a-release.apk" "/tmp/Meerkat-${VERSION}-android-arm32v7.apk" || true
          cp "$BUILD_DIR/app-arm64-v8a-release.apk"   "/tmp/Meerkat-${VERSION}-android-arm64v8.apk" || true
          cp "$BUILD_DIR/app-x86_64-release.apk"      "/tmp/Meerkat-${VERSION}-android-x64.apk"     || true

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-result
          path: /tmp/Meerkat-*-android-*.apk

  # ─────────────────────────────────────────────
  # Linux x86_64 — tar.gz
  # ─────────────────────────────────────────────
  build_tar_x86_64:
    needs: get_version
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev ninja-build libayatana-appindicator3-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Check rust toolchain
        working-directory: app
        run: rustup show

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Build Linux
        working-directory: app
        run: flutter build linux

      - name: Create tar.gz
        run: |
          VERSION=${{ needs.get_version.outputs.version }}
          cd app/build/linux/x64/release/bundle
          tar -czvf "/tmp/Meerkat-${VERSION}-linux-x86-64.tar.gz" *

      - name: Upload tar.gz artifact
        uses: actions/upload-artifact@v4
        with:
          name: tar-gz-x86-64-result
          path: /tmp/Meerkat-*-linux-x86-64.tar.gz

  # ─────────────────────────────────────────────
  # Linux x86_64 — deb
  # ─────────────────────────────────────────────
  build_deb_x86_64:
    needs: get_version
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev ninja-build libayatana-appindicator3-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Check rust toolchain
        working-directory: app
        run: rustup show

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Enable flutter_distributor
        run: dart pub global activate flutter_distributor

      - name: Build deb package
        working-directory: app
        run: PATH="$PATH:$HOME/.pub-cache/bin" flutter_distributor package --platform linux --targets deb

      - name: Find and rename deb file
        id: find_deb
        run: |
          VERSION=${{ needs.get_version.outputs.version }}
          DEB_PATH=$(find app/dist -name "*.deb" | head -1)
          if [ -z "$DEB_PATH" ]; then
            echo "::error::No .deb file found in app/dist"
            exit 1
          fi
          DEST="/tmp/Meerkat-${VERSION}-linux-x86-64.deb"
          cp "$DEB_PATH" "$DEST"
          echo "deb_path=$DEST" >> $GITHUB_OUTPUT

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-x86-64-result
          path: ${{ steps.find_deb.outputs.deb_path }}

  # ─────────────────────────────────────────────
  # Linux x86_64 — AppImage
  # ─────────────────────────────────────────────
  build_appimage_x86_64:
    needs: get_version
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev ninja-build libayatana-appindicator3-dev libfuse2

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Check rust toolchain
        working-directory: app
        run: rustup show

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Build Linux
        working-directory: app
        run: flutter build linux

      - name: Prepare AppDir
        run: |
          mkdir -p AppDir/usr/share/icons/hicolor/32x32/apps
          mkdir -p AppDir/usr/share/icons/hicolor/128x128/apps
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp -r app/build/linux/x64/release/bundle/* AppDir/
          cp app/assets/img/logo-32.png  AppDir/usr/share/icons/hicolor/32x32/apps/meerkat.png
          cp app/assets/img/logo-128.png AppDir/usr/share/icons/hicolor/128x128/apps/meerkat.png
          cp app/assets/img/logo-256.png AppDir/usr/share/icons/hicolor/256x256/apps/meerkat.png

      - name: Copy AppImageBuilder recipe
        run: cp scripts/appimage/AppImageBuilder_x86_64.yml AppImageBuilder.yml

      - name: Build AppImage
        uses: AppImageCrafters/build-appimage@57c3bc6963f870ce3be103117de5b5e33ffbaeb6
        with:
          recipe: ./AppImageBuilder.yml

      - name: Rename AppImage
        run: |
          VERSION=${{ needs.get_version.outputs.version }}
          APPIMAGE=$(find . -maxdepth 1 -name "*.AppImage" ! -name "*.AppImage.zsync" | head -1)
          cp "$APPIMAGE" "/tmp/Meerkat-${VERSION}-linux-x86-64.AppImage"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimage-x86-64-result
          path: /tmp/Meerkat-*-linux-x86-64.AppImage

  # ─────────────────────────────────────────────
  # Windows x86_64 — zip
  # ─────────────────────────────────────────────
  build_windows_zip:
    needs: get_version
    runs-on: windows-2022

    steps:
      - name: Fix long file paths
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Build Windows
        working-directory: app
        run: flutter build windows

      - name: Create empty settings.json
        working-directory: app
        run: echo {} > build/windows/x64/runner/Release/settings.json

      - name: Add VC runtime DLLs
        working-directory: app
        run: |
          Copy-Item ../scripts/windows/x64/msvcp140.dll    build/windows/x64/runner/Release/
          Copy-Item ../scripts/windows/x64/vcruntime140.dll build/windows/x64/runner/Release/
          Copy-Item ../scripts/windows/x64/vcruntime140_1.dll build/windows/x64/runner/Release/

      - name: Zip release folder
        working-directory: app
        run: |
          $VERSION = "${{ needs.get_version.outputs.version }}"
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath "Meerkat-${VERSION}-windows-x86-64.zip"

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip-result
          path: app/Meerkat-*-windows-x86-64.zip

  # ─────────────────────────────────────────────
  # Upload all artifacts to the GitHub Release
  # ─────────────────────────────────────────────
  upload_release_assets:
    needs:
      - get_version
      - build_apk
      - build_tar_x86_64
      - build_deb_x86_64
      - build_appimage_x86_64
      - build_windows_zip
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List artifacts
        run: find release-assets -type f | sort

      - name: Ensure release exists for tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ needs.get_version.outputs.version }}
          TAG="v${VERSION}"
          # Create the release if it doesn't already exist
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Creating release for $TAG"
            gh release create "$TAG" \
              --title "🦊 Meerkat $TAG" \
              --notes "See [CHANGELOG](https://github.com/${GITHUB_REPOSITORY}/blob/main/app/assets/CHANGELOG.md) for details." \
              --repo "$GITHUB_REPOSITORY"
          else
            echo "Release $TAG already exists — uploading assets"
          fi

      - name: Upload all assets to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ needs.get_version.outputs.version }}
          TAG="v${VERSION}"
          # Upload every file in release-assets, skip if already uploaded
          for f in release-assets/*; do
            if [ -f "$f" ]; then
              FILENAME=$(basename "$f")
              echo "Uploading $FILENAME ..."
              gh release upload "$TAG" "$f" \
                --repo "$GITHUB_REPOSITORY" \
                --clobber
            fi
          done
